name: Verify site build and SEO pages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Open Graph image
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.8.2
          python -c "import cairosvg; cairosvg.svg2png(url='public/og-image.svg', write_to='public/og-image.png')"
      - run: npm ci
      - run: npm run build
      - name: Assert output and metadata
        run: |
          test -f dist/favicon.png
          test -f dist/apple-touch-icon.png
          test -f dist/og-image.png
          test -f dist/sitemap.xml
          test -f dist/collection/roblox/index.html
          test -f dist/collection/websites/index.html
          test -f dist/collection/products/index.html
          test -f dist/p/camera-system/index.html
          test -f dist/p/uiforging/index.html
          grep -q 'rel="canonical"' dist/index.html
          grep -q 'Camera System' dist/p/camera-system/index.html
          grep -q 'collection/roblox/' dist/sitemap.xml
          grep -q 'p/camera-system/' dist/sitemap.xml
